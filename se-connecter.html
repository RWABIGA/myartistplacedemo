<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Se connecter — My Artist Place</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;600;700&family=Ubuntu+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: { colors: { purple: { DEFAULT: '#7300ff', dark: '#5a00cc' }, gold: '#FFC400' }, fontFamily: { heading: ['Ubuntu', 'sans-serif'], body: ['Ubuntu Sans', 'sans-serif'] } } } };
  </script>
  <style>
    * { box-sizing: border-box; } body { font-family: 'Ubuntu Sans', sans-serif; font-weight: 300; color: #000; margin: 0; }
    h1, h2, h3, h4 { font-family: 'Ubuntu', sans-serif; }
    .btn-primary { background:#7300ff; color:#fff; font-family:'Ubuntu',sans-serif; font-weight:600; border-radius:9999px; padding:0.875rem 1.75rem; transition:background 0.2s,transform 0.15s; box-shadow:0 4px 16px rgba(115,0,255,0.35); display:block; width:100%; text-align:center; } .btn-primary:hover { background:#5a00cc; transform:translateY(-1px); }
    .input-field { width:100%; padding:0.875rem 1rem; border-radius:0.875rem; border:2px solid #e5e7eb; font-family:'Ubuntu Sans',sans-serif; font-size:0.95rem; color:#111; transition:border-color 0.2s; outline:none; } .input-field:focus { border-color:#7300ff; }
  </style>
</head>
<body style="background:linear-gradient(135deg,#f8f4ff 0%,#e8d9ff 50%,#f0e8ff 100%); min-height:100vh; display:flex; align-items:center; justify-content:center;">

  <!-- Card -->
  <div class="w-full max-w-md mx-4">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html"><img src="brand_assets/logo.png" alt="My Artist Place" class="h-10 w-auto mx-auto mb-4" /></a>
      <h1 class="font-heading font-semibold text-gray-900 text-2xl" style="letter-spacing:-0.02em;">Bienvenue de retour</h1>
      <p class="font-body text-gray-500 mt-2" style="font-weight:300;">Connectez-vous à votre espace My Artist Place</p>
    </div>

    <div class="bg-white rounded-3xl p-8" style="box-shadow:0 16px 64px rgba(115,0,255,0.15),0 4px 16px rgba(0,0,0,0.06);">
      <form onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label class="block font-heading font-semibold text-gray-700 text-sm mb-1.5">Adresse e-mail</label>
          <input type="email" required placeholder="votre@email.com" class="input-field" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="font-heading font-semibold text-gray-700 text-sm">Mot de passe</label>
            <a href="#" class="text-xs font-heading font-semibold" style="color:#7300ff;">Mot de passe oublié ?</a>
          </div>
          <input type="password" required placeholder="••••••••" class="input-field" />
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="remember" class="w-4 h-4 accent-purple-DEFAULT rounded" />
          <label for="remember" class="font-body text-gray-600 text-sm" style="font-weight:300;">Se souvenir de moi</label>
        </div>
        <button type="submit" class="btn-primary mt-2">Se connecter</button>
      </form>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-100"></div></div>
        <div class="relative text-center"><span class="bg-white px-4 font-body text-gray-400 text-sm">ou</span></div>
      </div>

      <!-- Social login -->
      <div class="space-y-3">
        <button class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-2xl border-2 border-gray-100 font-heading font-semibold text-gray-700 text-sm hover:bg-gray-50 hover:border-gray-200 transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continuer avec Google
        </button>
      </div>

      <p class="text-center font-body text-gray-500 text-sm mt-6" style="font-weight:300;">
        Pas encore de compte ?
        <a href="s-inscrire-entreprise.html" class="font-heading font-semibold ml-1" style="color:#7300ff;">S'inscrire gratuitement</a>
      </p>
    </div>

    <p class="text-center mt-6 text-xs text-gray-400">
      <a href="index.html" class="hover:text-gray-600 transition-colors">← Retour à l'accueil</a>
    </p>
  </div>

  <div id="error-toast" class="hidden fixed bottom-6 right-6 bg-red-500 text-white px-6 py-3 rounded-2xl font-heading font-semibold text-sm shadow-lg">Identifiants incorrects</div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      // Placeholder: show success redirect hint
      alert('Connexion simulée — intégrez votre backend ici.');
    }
  </script>
</body>
</html>
